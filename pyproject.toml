[project]
name = "experiment-saver"
version = "0.2.0"
description = "Lightweight local experiment saver for TensorFlow/Keras and PyTorch classification runs"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AhmedAbdAlKareem1" }]
requires-python = ">=3.8"
dependencies = ["numpy>=1.21,<3"]

[project.optional-dependencies]
tf    = ["tensorflow>=2.10", "scikit-learn"]
torch = ["torch>=1.10", "scikit-learn"]
dev   = [
  "pytest>=7",
  "pytest-cov",
  "build",
  "twine",
  "torchinfo",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["experiment_saver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
